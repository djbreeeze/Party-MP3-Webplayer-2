<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRO Party Player</title>
<style>
:root{--bg:#060a12;--panel:#0d1422;--line:#20304a;--text:#eef5ff;--muted:#8ea1bd;--accent:#35a8ff;--accent2:#6b5cff;--danger:#ff5270}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#12233d 0,#060a12 42%),#060a12;color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.sidebar{background:rgba(5,9,16,.94);border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:900;letter-spacing:.08em;margin-bottom:18px}.brand span{color:var(--accent)}
.navbtn,.catbtn{width:100%;text-align:left;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;margin:2px 0}.navbtn:hover,.catbtn:hover{background:#13233a;color:#fff}
.cathead{font-size:11px;text-transform:uppercase;color:#657b9a;letter-spacing:.12em;margin:22px 10px 7px}
.main{padding:24px;max-width:1500px;width:100%;margin:auto}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:3px}.search{display:flex;gap:8px;max-width:700px}
input,select{background:#0b1321;border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px 13px;outline:none}.search input{flex:1}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;padding:12px 16px;border-radius:10px;font-weight:800}
.secondary,.small{background:#17243a;color:#dceaff;padding:10px 13px;border-radius:9px}.danger{background:#341522;color:#ffb7c4;padding:9px 12px;border-radius:9px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}.panel{background:rgba(13,20,34,.88);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panelhead{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.songlist{max-height:calc(100vh - 250px);overflow:auto}.song{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 16px;border-bottom:1px solid rgba(32,48,74,.65)}.song:hover{background:#101c2e}
.songtitle{font-weight:750}.artist{color:var(--muted);font-size:13px}.actions{display:flex;gap:6px;align-items:center}.play{background:#183f63;color:#fff}
.player{padding:14px}.playerbox{aspect-ratio:16/9;background:#03060a;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}.playerbox iframe{width:100%;height:100%;border:0}
.now{padding:13px 2px 3px}.now b{display:block}.empty{padding:28px;color:var(--muted);text-align:center}
.result{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.result img{width:120px;height:68px;object-fit:cover;border-radius:8px;background:#111}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}
.dialog{background:#0d1422;border:1px solid var(--line);border-radius:16px;width:min(620px,100%);padding:20px}.formgrid{display:grid;gap:10px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--muted)}.help{font-size:12px;color:var(--muted);margin-top:8px}.badge{font-size:12px;background:#162a43;color:#9fd4ff;padding:5px 8px;border-radius:999px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111d2f;border:1px solid var(--line);padding:11px 15px;border-radius:10px;display:none;z-index:20}
@media(max-width:1050px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}.songlist{max-height:none}}
@media(max-width:650px){.main{padding:14px}.top{align-items:stretch;flex-direction:column}.search{max-width:none}.result{grid-template-columns:90px 1fr}.result .small{grid-column:2}.formrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">VYRO<span>•</span>PLAYER</div>
  <button class="navbtn" onclick="showAll()">🏠 Alle Songs</button>
  <button class="navbtn" onclick="openAdd()">➕ Song hinzufügen</button>
  <button class="navbtn" onclick="openSettings()">⚙️ Einstellungen</button>
  <div class="cathead">Kategorien</div>
  <div id="categories"></div>
  <div class="help">556 Start-Song-Einträge aus deiner Textdatei. Eigene Songs werden lokal gespeichert.</div>
</aside>
<main class="main">
  <div class="top">
    <div><h1 id="heading">Alle Songs</h1><div class="sub" id="count"></div></div>
    <div class="search">
      <input id="songSearch" placeholder="Songliste durchsuchen …" oninput="renderSongs()">
      <button class="primary" onclick="youtubeSearch()">🔎 YouTube</button>
    </div>
  </div>
  <div class="grid">
    <section class="panel">
      <div class="panelhead"><strong>Songliste</strong><span class="badge" id="catBadge">Alle</span></div>
      <div class="songlist" id="songList"></div>
    </section>
    <aside class="panel">
      <div class="panelhead"><strong>▶ Player</strong><span class="badge">YouTube</span></div>
      <div class="player">
        <div class="playerbox" id="playerbox">Noch keinen Song ausgewählt.</div>
        <div class="now" id="now"><span class="artist">Klicke bei einem Song auf ▶</span></div>
      </div>
      <div class="panelhead"><strong>🔎 YouTube-Ergebnisse</strong></div>
      <div style="padding:14px" id="results"><div class="empty">Suche einen Song oder Künstler.</div></div>
    </aside>
  </div>
</main>
</div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div>

 const artist=document.getElementById('aArtist').value.trim(),title=document.getElementById('aTitle').value.trim(),url=document.getElementById('aUrl').value.trim();let cat=document.getElementById('aCat').value;

 if(!artist||!title){toast('Künstler und Titel fehlen.');return}
 ownSongs.push({id:crypto.randomUUID(),artist,title,url,category:cat});save();renderCategories();closeModal();renderSongs();toast('Song gespeichert.')
}
function addSearchResult(videoId,title,channel){const cat=currentCategory||ownCats[0]||'🎵 Meine Songs';if(!ownCats.includes(cat))ownCats.push(cat);ownSongs.push({id:crypto.randomUUID(),artist:channel,title,url:'https://www.youtube.com/watch?v='+videoId,category:cat,videoId});save();renderCategories();renderSongs();toast('YouTube-Song hinzugefügt.')}
function deleteOwn(id){ownSongs=ownSongs.filter(s=>s.id!==id);save();renderCategories();renderSongs();toast('Song gelöscht.')}
function openSettings(){
 document.getElementById('dialog').innerHTML=`<h2>⚙️ Einstellungen</h2><p class="help">Der YouTube-Key ist im HTML eingebaut. Für eine öffentliche Website solltest du ihn in Google Cloud auf deine Website-Domain einschränken oder später ein Backend verwenden.</p><div class="formgrid"><div><label>Lokale Daten</label><br><button class="danger" onclick="clearOwn()">Eigene Songs/Kategorien löschen</button></div><div style="display:flex;justify-content:flex-end"><button class="secondary" onclick="closeModal()">Schließen</button></div></div>`;openModal()
}
function clearOwn(){if(confirm('Wirklich alle eigenen Songs und Kategorien löschen?')){ownSongs=[];ownCats=[];save();renderCategories();showAll();closeModal();toast('Eigene Daten gelöscht.')}}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('songSearch').focus()}});
init();
</script>
